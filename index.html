<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Rutina de gimnasio en casa con mancuernas ajustables, cronómetro de descanso y registro de series.">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MicroApp Gym</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">

  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <main class="app__main">
      <section class="screen is-active" id="pantalla-hoy" data-pantalla="hoy" aria-label="Hoy"></section>
      <section class="screen" id="pantalla-rutina" data-pantalla="rutina" aria-label="Rutina" inert></section>
      <section class="screen" id="pantalla-ejercicios" data-pantalla="ejercicios" aria-label="Ejercicios" inert></section>
      <section class="screen" id="pantalla-historial" data-pantalla="historial" aria-label="Historial" inert></section>
      <section class="screen" id="pantalla-ajustes" data-pantalla="ajustes" aria-label="Ajustes" inert></section>

      <noscript>
        <div class="empty-state">
          <p>MicroApp Gym necesita JavaScript activado para funcionar.</p>
        </div>
      </noscript>
    </main>

    <nav class="tabbar" aria-label="Secciones">
      <a class="tabbar__item is-active" href="#hoy" data-tab="hoy" aria-current="page">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
        </svg>
        <span class="tabbar__label">Hoy</span>
      </a>
      <a class="tabbar__item" href="#rutina" data-tab="rutina">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="4" width="14" height="17" rx="2"/>
          <path d="M9 4V3h6v1"/>
          <path d="M9 10h6M9 14h6M9 18h3"/>
        </svg>
        <span class="tabbar__label">Rutina</span>
      </a>
      <a class="tabbar__item" href="#ejercicios" data-tab="ejercicios">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 12h8"/>
          <rect x="4.5" y="6.5" width="3.5" height="11" rx="1"/>
          <rect x="16" y="6.5" width="3.5" height="11" rx="1"/>
          <path d="M2.5 10v4M21.5 10v4"/>
        </svg>
        <span class="tabbar__label">Ejercicios</span>
      </a>
      <a class="tabbar__item" href="#historial" data-tab="historial">
        <svg class="tabbar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V4"/>
          <path d="M4 20h16"/>
          <path d="M8 16v-4M12 16V8M16 16v-6"/>
        </svg>
        <span class="tabbar__label">Historial</span>
      </a>
    </nav>

    <div class="toast" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
